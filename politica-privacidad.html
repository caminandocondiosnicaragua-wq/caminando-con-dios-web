<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Política de Privacidad | Caminando con Dios</title>

    <meta
        name="description"
        content="Política de Privacidad de Caminando con Dios. Información sobre los datos que se utilizan al acceder a la plataforma y cómo se manejan."
    >

    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/legal.css">
</head>

<body>

    <main id="app"></main>

    <!-- CONFIG -->
    <script src="assets/js/config.js"></script>

    <!-- UTILIDADES -->
    <script src="assets/js/utilidades/helpers.js"></script>
    <script src="assets/js/utilidades/idiomas.js"></script>

    <!-- INTERFAZ -->
    <script src="assets/js/interfaz/header.js"></script>
    <script src="assets/js/interfaz/hero.js"></script>
    <script src="assets/js/interfaz/footer.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function(){
            const app = document.getElementById("app");

            app.innerHTML = `
                ${crearHeader()}
                ${crearHero()}

                <div class="contenedor">
                    <main class="legal-pagina">

                        <div class="legal-cabecera">
                            <h1>🔒 Política de Privacidad</h1>
                            <p>Tu privacidad es importante para nosotros.</p>
                        </div>

                        <section class="legal-seccion">
                            <h2>1. Sobre esta política</h2>
                            <p>
                                Esta Política de Privacidad explica cómo <strong>Caminando con Dios</strong>
                                utiliza la información relacionada con las personas que utilizan nuestra
                                plataforma y, especialmente, con quienes crean una cuenta para participar
                                en los contenidos de la Comunidad.
                            </p>
                            <p>
                                Caminando con Dios es un proyecto orientado a compartir la Palabra de Dios,
                                evangelizar, discipular y ofrecer recursos para el crecimiento espiritual.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>2. Información que podemos recibir</h2>
                            <p>
                                Cuando una persona inicia sesión mediante Google, podemos recibir de Google
                                información básica necesaria para identificar su cuenta, como su nombre y
                                dirección de correo electrónico.
                            </p>
                            <p>
                                La plataforma también puede generar un identificador interno de usuario y
                                conservar información relacionada con su participación, como el curso,
                                parte, paso, progreso y respuestas que la persona decida proporcionar dentro
                                de los contenidos interactivos.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>3. Para qué utilizamos la información</h2>
                            <p>La información se utiliza para:</p>
                            <ul>
                                <li>crear y reconocer la cuenta del usuario dentro de Caminando con Dios;</li>
                                <li>permitir el acceso a contenidos de la Comunidad;</li>
                                <li>guardar y recuperar el avance en los recorridos de discipulado;</li>
                                <li>guardar las respuestas que el usuario envíe en actividades o estudios;</li>
                                <li>mejorar la organización y funcionamiento de la plataforma; y</li>
                                <li>facilitar comunicaciones relacionadas con la plataforma cuando corresponda.</li>
                            </ul>
                        </section>

                        <section class="legal-seccion">
                            <h2>4. Inicio de sesión con Google</h2>
                            <p>
                                Caminando con Dios utiliza el servicio de inicio de sesión de Google para
                                facilitar el acceso de los usuarios. La plataforma no solicita ni almacena
                                la contraseña de la cuenta de Google.
                            </p>
                            <p>
                                Google autentica al usuario y proporciona la información de identidad necesaria
                                para que Caminando con Dios pueda crear o reconocer su cuenta. El uso de la
                                cuenta de Google también está sujeto a las políticas y condiciones de Google.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>5. Dónde se puede almacenar la información</h2>
                            <p>
                                Para administrar el funcionamiento de la plataforma, determinada información
                                de los usuarios puede ser procesada y almacenada en servicios utilizados por
                                Caminando con Dios, incluyendo Google Apps Script, Google Sheets y Notion.
                            </p>
                            <p>
                                Estos servicios se utilizan como parte de la infraestructura técnica de la
                                plataforma y pueden estar sujetos a sus propias políticas de privacidad y
                                seguridad.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>6. Información que el usuario proporciona voluntariamente</h2>
                            <p>
                                Algunos contenidos de discipulado o estudio pueden solicitar respuestas del
                                usuario. Estas respuestas se almacenan para permitir que la plataforma conserve
                                el avance y pueda continuar el recorrido posteriormente.
                            </p>
                            <p>
                                El usuario debe evitar introducir en los formularios información personal
                                sensible que no sea necesaria para la actividad correspondiente.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>7. Protección de la información</h2>
                            <p>
                                Procuramos utilizar medidas razonables para proteger la información administrada
                                por la plataforma. Sin embargo, ningún sistema conectado a Internet puede
                                garantizar seguridad absoluta.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>8. Compartición de información</h2>
                            <p>
                                No vendemos los datos personales de nuestros usuarios. La información se utiliza
                                para operar Caminando con Dios y no se comparte públicamente como parte del
                                funcionamiento normal de la plataforma.
                            </p>
                            <p>
                                Podremos utilizar proveedores tecnológicos necesarios para prestar el servicio,
                                como los indicados en esta política, de acuerdo con sus respectivas condiciones
                                y políticas de privacidad.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>9. Enlaces y servicios externos</h2>
                            <p>
                                Caminando con Dios puede incluir enlaces o integrar servicios de terceros. Al
                                acceder a esos servicios, el usuario también queda sujeto a las políticas y
                                condiciones de sus respectivos proveedores.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>10. Cambios en esta política</h2>
                            <p>
                                Esta política puede actualizarse cuando cambien las funciones, servicios o formas
                                en que se administra la información dentro de Caminando con Dios. Cuando se
                                realicen cambios importantes, procuraremos reflejarlos claramente en esta página.
                            </p>
                        </section>

                        <section class="legal-seccion">
                            <h2>11. Contacto</h2>
                            <p>
                                Si tienes preguntas sobre esta Política de Privacidad o sobre el uso de tus datos
                                dentro de Caminando con Dios, puedes comunicarte con nosotros mediante el correo
                                de contacto de la plataforma:
                            </p>
                            <p class="legal-contacto"><strong>caminandocondiosnicaragua@gmail.com</strong></p>
                        </section>

                        <div class="legal-regreso">
                            <a href="acerca.html">← Volver a Acerca de Caminando con Dios</a>
                        </div>

                    </main>
                </div>

                ${crearFooter()}
            `;

            app.style.display = "block";
            iniciarHeader();
            iniciarFooter();
        });
    </script>

    <script src="assets/js/utilidades/idiomas-global.js"></script>

</body>

</html>
